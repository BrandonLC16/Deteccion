camera:
  index: 0
  width: 1280
  height: 720
  mirror: true

hand_detection:
  max_hands: 2
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5

recognition:
  similarity_method: cosine
  similarity_threshold: 0.87
  gesture_thresholds: {}
  mirror_left_hand: true

temporal_filter:
  window_size: 7
  stable_frames: 5
  min_consecutive_frames: 3
  hold_frames: 3
  hysteresis_frames: 1

display:
  show_landmarks: true
  show_fps: true
  result_image_width: 320
  result_image_height: 320

resources:
  hand_model: models/hand_landmarker.task
  gesture_templates: data/gesture_templates.npz
  gesture_metadata: data/gestures.json
  reference_images: assets/reference_images
  display_images: assets/display_images

logging:
  level: INFO
