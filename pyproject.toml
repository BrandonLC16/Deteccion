[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-matcher"
version = "0.1.0"
description = "Reconocimiento local de señas estáticas mediante landmarks de manos."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.35,<0.11",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<5",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.scripts]
gesture-matcher = "gesture_matcher.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", ".venv311"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
